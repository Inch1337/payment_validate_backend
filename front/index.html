<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демо-магазин</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>

  <body class="page">
    <header class="header">
      <a href="" class="logo"></a>
    </header>
    <main class="main">
      <!-- подумать над названием класса -->
      <section class="paid"> 
        <h1 class="paid__title">Демо-магазин</h1>
        <p class="paid__payment-amount">100 ₽</p>
        <ul class="payment-methods">
          <li class="payment-methods__item payment-methods__item__paypal">
            <!-- подумать над названием класса -->
            <a class="">
              <article>
                <div>
                  <img src="" alt="" class="payment-methods__item__paypal-logo">
                  <p>PayPal</p>
                </div>
                <img src="./image/chevron-right-svgrepo-com.svg" alt="" class="payment-methods__chevron-right">
              </article>
            </a>
          </li>
          <li class="paid__payment-methods__item payment-methods__item__crypto">
            <!-- подумать над названием класса -->
            <a class="">
              <article>
                <div>
                  <img src="" alt="" class="payment-methods__item__crypto-logo">
                  <p>Криптовалюта</p>
                </div>
                <img src="./image/chevron-right-svgrepo-com.svg" alt="" class="payment-methods__chevron-right">
              </article>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer class="footer">
      <p>Заплатив здесь, вы принимаете <a href="">условие сервиса</a></p>
    </footer>
  </body>
</html>
