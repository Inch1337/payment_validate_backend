<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демо-магазин</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>

  <body class="page">
    <header class="header">
      <p class="header__logo">
        <a href="" class="header__logo-link">Демо-магазин</a>
      </p>
    </header>
    <main class="main">
      <section class="paid">
        <div class="paid__info">
          <h1 class="paid__title">Демо-магазин</h1>
          <p class="paid__amount">100 ₽</p>
        </div>

        <ul class="payment-methods">
          <li class="payment-methods__item payment-methods__item--paypal">
            <a class="payment-methods__link" href="#">
              <article class="payment-methods__card">
                <div class="payment-methods__info">
                  <img
                    src="./images/paypal-logo.png"
                    alt="логотип PayPal"
                    class="payment-methods__logo payment-methods__logo--paypal"
                  />
                  <p class="payment-methods__name">PayPal</p>
                </div>
                <img
                  src="./images/chevron-right-svgrepo-com.svg"
                  alt=""
                  class="payment-methods__chevron"
                />
              </article>
            </a>
          </li>

          <li class="payment-methods__item payment-methods__item--crypto">
            <a class="payment-methods__link" href="#">
              <article class="payment-methods__card">
                <div class="payment-methods__info">
                  <img
                    src="./images/crypto-logo.svg"
                    alt="логотип криптовалюты"
                    class="payment-methods__logo payment-methods__logo--crypto"
                  />
                  <p class="payment-methods__name">Криптовалюта</p>
                </div>
                <img
                  src="./images/chevron-right-svgrepo-com.svg"
                  alt=""
                  class="payment-methods__chevron"
                />
              </article>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p>Заплатив здесь, вы принимаете <a href="">условие сервиса</a></p>
    </footer>
  </body>
</html>
